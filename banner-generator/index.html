<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Banner Creator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:           #000000;
  --surface:      #272729;
  --surface-2:    #2a2a2c;
  --border:       rgba(255, 255, 255, 0.08);
  --border-hover: rgba(255, 255, 255, 0.16);
  --text:         #ffffff;
  --muted:        #86868b;
  --accent:       #2997ff;
  --accent-glow:  rgba(41, 151, 255, 0.08);
  --on-accent:    #ffffff;
  --font: 'Inter', -apple-system, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --radius-sm: 8px;
  --radius-lg: 18px;
  --radius-pill: 9999px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { height: 100%; }
html { overflow-y: auto; scrollbar-gutter: stable; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 32px 40px 40px;
}

/* Header */
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 32px;
  flex-wrap: wrap;
  gap: 16px;
}
.header-left {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
.app-header h1 {
  font-size: 26px;
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.1;
}

.back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
  text-decoration: none;
  border-radius: var(--radius-pill);
  padding: 7px 14px 7px 10px;
  font-size: 12px;
  font-weight: 400;
  transition: border-color 0.15s ease, background 0.15s ease;
}
.back-link:hover { border-color: var(--border-hover); background: rgba(255,255,255,0.04); }
.back-link svg { width: 14px; height: 14px; stroke: currentColor; flex-shrink: 0; }

/* Layout */
.layout {
  display: flex;
  gap: 20px;
  flex: 1;
  align-items: flex-start;
  flex-wrap: wrap;
}

/* Sidebar */
.sidebar {
  width: 380px;
  flex-shrink: 0;
  order: -1;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.sb-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; }

.section-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 10px;
}

.field { margin-bottom: 10px; }
.field:last-child { margin-bottom: 0; }
.field label {
  display: block;
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 5px;
}

/* Inputs */
input[type="text"], select {
  width: 100%;
  font-size: 13px;
  font-family: var(--font);
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 9px 14px;
  outline: none;
  transition: border-color 0.15s, color 0.15s;
}
input[type="text"] { border-radius: var(--radius-pill); }
select { border-radius: var(--radius-sm); }
input[type="text"]:focus, select:focus { border-color: var(--accent); }
input[type="text"]::placeholder { color: var(--muted); }
select { cursor: pointer; }

.hint {
  font-size: 10px;
  color: #3a3a3a;
  margin-top: 5px;
  line-height: 1.5;
}
.hint code { color: #505050; font-family: monospace; }

.color-row { display: flex; gap: 6px; }
.color-row input[type="text"] { flex: 1; }
.color-row input[type="color"] {
  width: 34px; min-width: 34px; height: 34px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 2px 3px; cursor: pointer;
}

/* Upload zone */
.upload-zone {
  border: 1.5px dashed var(--border-hover);
  border-radius: var(--radius-lg);
  padding: 16px;
  text-align: center;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  background: #000;
  transition: border-color 0.2s, background 0.2s;
}
.upload-zone:hover { border-color: var(--accent); background: var(--accent-glow); }
.upload-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.upload-zone .uz-icon { font-size: 20px; color: #333; margin-bottom: 4px; }
.upload-zone .uz-text { font-size: 12px; color: var(--muted); }
.upload-zone .uz-sub { font-size: 10px; color: #3a3a3a; margin-top: 2px; }
.thumb { width: 100%; max-height: 56px; object-fit: contain; border-radius: 4px; display: none; margin-bottom: 6px; }
.thumb.visible { display: block; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: var(--accent); color: var(--on-accent); border: none;
  border-radius: var(--radius-pill); padding: 10px 14px;
  font-size: 14px; font-weight: 400; font-family: var(--font);
  cursor: pointer; transition: transform 0.1s ease; width: 100%;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { background: var(--surface-2); color: var(--muted); transform: none; cursor: default; }

.btn-ghost {
  background: none; border: 1px solid var(--border-hover); color: var(--muted);
  border-radius: var(--radius-pill); padding: 6px 14px;
  font-size: 12px; font-weight: 400; font-family: var(--font);
  cursor: pointer; transition: border-color 0.15s, color 0.15s;
}
.btn-ghost:hover { border-color: var(--text); color: var(--text); }

/* Progress */
.progress-wrap { margin-top: 8px; display: none; }
.progress-wrap.visible { display: block; }
.progress-bar-track { width: 100%; height: 2px; background: var(--border-hover); border-radius: 2px; overflow: hidden; }
.progress-bar-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.2s; border-radius: 2px; }
.progress-label { font-size: 10px; color: var(--muted); margin-top: 5px; text-align: center; }

/* Main grid */
.main {
  flex: 1 1 640px; min-width: 0;
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-content: start;
}

.banner-block { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.banner-meta { display: flex; align-items: baseline; gap: 8px; }
.banner-name { font-size: 12px; font-weight: 600; color: var(--text); }
.banner-dims { font-size: 11px; color: var(--muted); }
.canvas-wrap { width: 100%; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border); background: #000; }
.canvas-wrap canvas { display: block; width: 100%; height: auto; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

<div class="app-header">
  <div class="header-left">
    <a class="back-link" href="../index.html"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19l-7-7 7-7"/></svg>Toolbox</a>
    <div>
      <h1>Social Banner Creator</h1>
    </div>
  </div>
  <button class="btn-ghost" id="clearBtn">Clear all</button>
</div>

<div class="layout">
  <main class="main" id="mainArea"></main>

  <aside class="sidebar">

    <div class="sb-section">
      <div style="display:flex;flex-direction:column;gap:8px;">
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="width:20px;height:20px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--on-accent);flex-shrink:0;">1</div>
          <div>
            <div style="font-size:12px;font-weight:600;color:var(--text);">Select label</div>
            <div style="font-size:11px;color:var(--muted);margin-top:1px;">Pick your label preset</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="width:20px;height:20px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--on-accent);flex-shrink:0;">2</div>
          <div>
            <div style="font-size:12px;font-weight:600;color:var(--text);">Drop artwork</div>
            <div style="font-size:11px;color:var(--muted);margin-top:1px;">System scans text for artist / title</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="width:20px;height:20px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--on-accent);flex-shrink:0;">3</div>
          <div>
            <div style="font-size:12px;font-weight:600;color:var(--text);">Adjust &amp; export</div>
            <div style="font-size:11px;color:var(--muted);margin-top:1px;">Tweak colors, download all</div>
          </div>
        </div>
      </div>
    </div>

    <div class="sb-section">
      <div class="section-label">Label</div>
      <div class="field">
        <select id="logoPreset">
          <option value="">— Select label —</option>
          <option value="spinnin">Spinnin' Records</option>
          <option value="spinnindeep">Spinnin' Deep</option>
        </select>
      </div>
    </div>

<div class="sb-section">
      <div class="section-label">Artwork</div>
      <div class="upload-zone" id="artworkZone">
        <input type="file" accept="image/*" id="artworkUpload">
        <img class="thumb" id="artworkThumb" alt="">
        <div class="uz-icon">&#8593;</div>
        <div class="uz-text">Click to upload</div>
        <div class="uz-sub">Cover art / key visual</div>
      </div>
      <div class="field" style="margin-top:12px;">
        <label style="display:flex;justify-content:space-between;"><span>Crop position</span><span id="cropVal" style="color:var(--muted);">50%</span></label>
        <input type="range" id="cropSlider" min="0" max="100" value="50" style="width:100%;margin-top:6px;accent-color:var(--accent);cursor:pointer;">
      </div>
    </div>

    <div class="sb-section">
      <div class="section-label">Bar style</div>
      <div class="field">
        <label>Bar background color</label>
        <div class="color-row">
          <input type="text" id="barColorTxt" value="#000000" maxlength="7">
          <input type="color" id="barColorPick" value="#000000">
        </div>
      </div>
      <div class="field">
        <label>Text color</label>
        <div class="color-row">
          <input type="text" id="txtColorTxt" value="#ffffff" maxlength="7">
          <input type="color" id="txtColorPick" value="#ffffff">
        </div>
      </div>
    </div>

    <div class="sb-section">
      <div class="section-label">Export</div>
      <button class="btn" id="btnExportAll">&#8595; Download all banners</button>
      <div class="progress-wrap" id="progressWrap">
        <div class="progress-bar-track"><div class="progress-bar-fill" id="progressFill"></div></div>
        <div class="progress-label" id="progressLabel">Processing...</div>
      </div>
    </div>

  </aside>
</div>
<script>
const SIZES = [
  { id: 'facebook',   name: 'Facebook Cover',   w: 1640, h: 624  },
  { id: 'soundcloud', name: 'SoundCloud',        w: 2480, h: 520  },
  { id: 'youtube',    name: 'YouTube / Twitter', w: 2560, h: 1440, safeX: 507, safeY: 509, safeW: 1546, safeH: 423 },
  { id: 'website',    name: 'Website Banner',    w: 1920, h: 302  },
  { id: 'tiktok',     name: 'TikTok',            w: 686,  h: 180  },
  { id: 'instagram',  name: 'Instagram',         w: 1030, h: 216  },
  { id: 'adwords',    name: 'Adwords',           w: 1084, h: 1080 },
];

const state = {
  artistName: '',
  trackTitle: '',
  barColor: '#000000',
  textColor: '#ffffff',
  bgImage: null,
  logoImage: null,
  invertLogo: false,
  cropOffset: 0.5,
};

// Build banner blocks
const canvases = {};
const mainArea = document.getElementById('mainArea');
SIZES.forEach(s => {
  const block = document.createElement('div'); block.className = 'banner-block';
  const meta  = document.createElement('div'); meta.className = 'banner-meta';
  meta.innerHTML = `<span class="banner-name">${s.name}</span><span class="banner-dims">${s.w} × ${s.h} px</span>`;
  const wrap   = document.createElement('div'); wrap.className = 'canvas-wrap';
  const canvas = document.createElement('canvas');
  wrap.appendChild(canvas); canvases[s.id] = canvas;
  block.appendChild(meta); block.appendChild(wrap);
  mainArea.appendChild(block);
});

// Inputs
const barColorTxt   = document.getElementById('barColorTxt');
const barColorPick  = document.getElementById('barColorPick');
const txtColorTxt   = document.getElementById('txtColorTxt');
const txtColorPick  = document.getElementById('txtColorPick');
const artworkUpload = document.getElementById('artworkUpload');
const artworkThumb  = document.getElementById('artworkThumb');
const cropSlider    = document.getElementById('cropSlider');
const cropVal       = document.getElementById('cropVal');

function parseRelease(val) {
  const idx = val.indexOf(' - ');
  if (idx === -1) return { artistName: val.trim(), trackTitle: '' };
  return { artistName: val.slice(0, idx).trim(), trackTitle: val.slice(idx + 3).trim() };
}

function syncColor(txtEl, pickEl, key) {
  txtEl.addEventListener('input', () => {
    if (/^#[0-9a-fA-F]{6}$/.test(txtEl.value)) { pickEl.value = txtEl.value; state[key] = txtEl.value; renderAll(); }
  });
  pickEl.addEventListener('input', () => { txtEl.value = pickEl.value; state[key] = pickEl.value; renderAll(); });
}
syncColor(barColorTxt, barColorPick, 'barColor');
syncColor(txtColorTxt, txtColorPick, 'textColor');

cropSlider.addEventListener('input', () => {
  state.cropOffset = cropSlider.value / 100;
  cropVal.textContent = cropSlider.value + '%';
  renderAll();
});

function loadImg(file, thumbEl, stateKey, zoneEl) {
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      state[stateKey] = img;
      thumbEl.src = img.src; thumbEl.classList.add('visible');
      zoneEl.querySelector('.uz-icon').style.display = 'none';
      zoneEl.querySelector('.uz-text').style.display = 'none';
      zoneEl.querySelector('.uz-sub').style.display = 'none';
      renderAll();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

artworkUpload.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  loadImg(file, artworkThumb, 'bgImage', document.getElementById('artworkZone'));

  // Auto-fill release input from filename
  const name = file.name.replace(/\.[^/.]+$/, ''); // strip extension
  if (name.includes(' - ')) {
    const p = parseRelease(name);
    state.artistName = p.artistName;
    state.trackTitle = p.trackTitle;
    renderAll();
  }
});

// Clear all
document.getElementById('clearBtn').addEventListener('click', () => {
  state.artistName = ''; state.trackTitle = '';
  state.bgImage = null; state.logoImage = null; state.invertLogo = false;
  artworkThumb.src = ''; artworkThumb.classList.remove('visible');
  artworkUpload.value = '';
  document.querySelector('#artworkZone .uz-icon').style.display = '';
  document.querySelector('#artworkZone .uz-text').style.display = '';
  document.querySelector('#artworkZone .uz-sub').style.display = '';
  state.barColor = '#000000'; state.textColor = '#ffffff';
  barColorTxt.value = '#000000'; barColorPick.value = '#000000';
  txtColorTxt.value = '#ffffff'; txtColorPick.value = '#ffffff';
  state.cropOffset = 0.5; cropSlider.value = 50; cropVal.textContent = '50%';
  document.getElementById('logoPreset').value = '';
  renderAll();
});

// Word wrap
function wrapText(ctx, text, maxWidth) {
  if (!text) return [''];
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const word of words) {
    const test = line ? line + ' ' + word : word;
    if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = word; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines.length ? lines : [''];
}

// Draw
function drawBanner(canvas, size, scale, isExport) {
  const W = size.w, H = size.h;
  canvas.width  = Math.round(W * scale);
  canvas.height = Math.round(H * scale);
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);

  const safeX = size.safeX || 0;
  const safeY = size.safeY || 0;
  const safeW = size.safeW || W;
  const safeH = size.safeH || H;
  const barW  = safeW / 3;
  const imgW  = safeX + safeW - barW;
  const font  = `'Helvetica Neue', Helvetica, Arial, sans-serif`;
  const isAdwords = size.id === 'adwords';

  // Sizes — all proportional to safeH, capped for tall banners
  const refH       = Math.min(safeH, 400);
  const artistSize = size.id === 'adwords' ? refH * 0.065 : refH * 0.10;
  const titleSize  = size.id === 'adwords' ? refH * 0.05  : refH * 0.075;
  const btnSize    = size.id === 'adwords' ? refH * 0.038 : refH * 0.055;
  const padY       = refH * 0.08;
  const logoH      = refH * 0.10;
  const secGap     = isAdwords ? safeH * 0.02 : safeH * 0.04;
  const btnH       = btnSize * 2.5;
  const dividerH   = Math.max(1, safeH * 0.003);
  const artistLineH = artistSize * 0.95;
  const titleLineH  = titleSize  * 0.95;
  const textGap     = artistSize * 0.15;
  const padX        = barW * 0.1;
  const innerW      = barW - padX * 2;
  const tx          = imgW + padX;

  // Background
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, W, H);

  if (state.bgImage) {
    const img = state.bgImage;
    if (size.id === 'adwords') {
      const scaleX = imgW / img.width;
      const scaleY = H   / img.height;
      const sc     = Math.max(scaleX, scaleY);
      const dw = img.width * sc, dh = img.height * sc;
      ctx.drawImage(img, 0, 0, img.width, img.height, (imgW - dw) / 2, (H - dh) / 2, dw, dh);
    } else {
      const scaleX = imgW / img.width;
      const scaleY = H   / img.height;
      const sc     = Math.max(scaleX, scaleY);
      const dw = img.width * sc, dh = img.height * sc;
      const dx = (imgW - dw) / 2;
      const dy = (H - dh) * state.cropOffset;
      ctx.drawImage(img, 0, 0, img.width, img.height, dx, dy, dw, dh);
    }
  }

  // Bar
  ctx.fillStyle = state.barColor;
  ctx.fillRect(imgW, 0, W - imgW, H);

  // Text
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  const artistFont = `700 ${artistSize}px ${font}`;
  const titleFont  = `italic 400 ${titleSize}px ${font}`;
  const btnFont    = `700 ${btnSize}px ${font}`;

  const isPlaceholder = !state.artistName && !state.trackTitle;
  const artistText = state.artistName || 'ARTIST NAME';
  const trackText  = state.trackTitle  || 'TRACK TITLE';

  ctx.font = artistFont;
  const artistLines = wrapText(ctx, artistText.toUpperCase(), innerW);
  ctx.font = titleFont;
  const titleLines  = wrapText(ctx, trackText.toUpperCase(), innerW);


  // Top block — skip for Adwords, drawn later as part of centered block
  let y = safeY + padY;
  if (!isAdwords) {
    ctx.font = artistFont; ctx.fillStyle = state.textColor;
    ctx.globalAlpha = isPlaceholder ? 0.25 : 1;
    for (const line of artistLines) { y += artistLineH; ctx.fillText(line, tx, y); }
    y += textGap;
    ctx.font = titleFont;
    ctx.globalAlpha = isPlaceholder ? 0.2 : 0.8;
    for (const line of titleLines) { y += titleLineH; ctx.fillText(line, tx, y); }
    ctx.globalAlpha = 1;
  }

  // Bottom block
  const bottomH = btnH + secGap + dividerH + secGap + logoH;
  const topH    = artistLines.length * artistLineH + textGap + titleLines.length * titleLineH;
  const totalH  = topH + secGap * 2 + bottomH;
  const centerY = safeY + (safeH - totalH) / 2;
  let yb = isAdwords
    ? centerY + topH + secGap * 2
    : safeY + safeH - padY - bottomH;

  // For Adwords: override y to start from centered position
  if (isAdwords) {
    y = centerY;
    ctx.font = artistFont; ctx.fillStyle = state.textColor;
    ctx.globalAlpha = isPlaceholder ? 0.25 : 1;
    for (const line of artistLines) { y += artistLineH; ctx.fillText(line, tx, y); }
    y += textGap;
    ctx.font = titleFont;
    ctx.globalAlpha = isPlaceholder ? 0.2 : 0.8;
    for (const line of titleLines) { y += titleLineH; ctx.fillText(line, tx, y); }
    ctx.globalAlpha = 1;
  }

  // Button
  const btnLineW = size.id === 'adwords' ? Math.max(1, safeH * 0.0015) : Math.max(1, safeH * 0.004);
  ctx.strokeStyle = state.textColor; ctx.lineWidth = btnLineW;
  ctx.strokeRect(tx, yb, innerW, btnH);
  ctx.fillStyle = state.textColor; ctx.font = btnFont;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('AVAILABLE NOW!', tx + innerW / 2, yb + btnH / 2);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  yb += btnH + secGap;

  // Divider
  ctx.fillStyle = state.textColor; ctx.globalAlpha = 0.35;
  ctx.fillRect(tx, yb, innerW, dividerH);
  ctx.globalAlpha = 1;
  yb += dividerH + secGap;

  // Logo
  if (state.logoImage) {
    const logo = state.logoImage;
    const lr = logo.width / logo.height;
    let lw = Math.min(innerW, logoH * lr), lh = lw / lr;
    if (lh > logoH) { lh = logoH; lw = lh * lr; }
    ctx.drawImage(logo, tx, yb, lw, lh);
  } else {
    ctx.fillStyle = state.textColor; ctx.globalAlpha = 0.12;
    ctx.fillRect(tx, yb, innerW * 0.55, logoH);
    ctx.globalAlpha = 0.3; ctx.font = `500 ${Math.max(btnSize * 0.85, 8)}px ${font}`;
    ctx.textBaseline = 'middle';
    ctx.fillText('LABEL LOGO', tx + 6, yb + logoH / 2);
    ctx.textBaseline = 'alphabetic'; ctx.globalAlpha = 1;
  }

  // YouTube safe zone overlay
  if (size.safeW && !isExport) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, safeX, H);
    ctx.fillRect(safeX + safeW, 0, W - safeX - safeW, H);
    ctx.fillRect(safeX, 0, safeW, safeY);
    ctx.fillRect(safeX, safeY + safeH, safeW, H - safeY - safeH);
    ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 2; ctx.setLineDash([8, 6]);
    ctx.strokeRect(safeX, safeY, safeW, safeH); ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = `${Math.max(H * 0.016, 10)}px sans-serif`;
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText('Safe zone 1546×423', safeX + 8, safeY + 8);
    ctx.textBaseline = 'alphabetic';
  }
}

const DPR = Math.min(window.devicePixelRatio || 2, 3);

function renderAll() {
  SIZES.forEach(s => {
    const canvas = canvases[s.id];
    // Get actual rendered CSS width of the canvas element
    const cssW  = canvas.parentElement.clientWidth || 460;
    const scale = (cssW / s.w) * DPR;
    drawBanner(canvas, s, scale, false);
    canvas.style.width  = '100%';
    canvas.style.height = 'auto';
  });
}

// Export
function renderToBlob(size) {
  return new Promise(resolve => {
    const c = document.createElement('canvas');
    drawBanner(c, size, 1, true);
    c.toBlob(blob => resolve(blob), 'image/png');
  });
}

document.getElementById('btnExportAll').addEventListener('click', async () => {
  const btn  = document.getElementById('btnExportAll');
  const wrap = document.getElementById('progressWrap');
  const fill = document.getElementById('progressFill');
  const lbl  = document.getElementById('progressLabel');

  btn.disabled = true; wrap.classList.add('visible');

  if (window.showDirectoryPicker) {
    let rootDir;
    try { rootDir = await window.showDirectoryPicker({ mode: 'readwrite' }); }
    catch (e) { btn.disabled = false; wrap.classList.remove('visible'); return; }
    const bannersDir = await rootDir.getDirectoryHandle('Banners', { create: true });
    for (let i = 0; i < SIZES.length; i++) {
      const size = SIZES[i];
      lbl.textContent  = `${size.name} (${i + 1}/${SIZES.length})`;
      fill.style.width = ((i / SIZES.length) * 100) + '%';
      const blob = await renderToBlob(size);
      const folderName = size.name.replace(/[/\\:*?<>|]/g, '-').trim();
      const subDir = await bannersDir.getDirectoryHandle(folderName, { create: true });
      const fh = await subDir.getFileHandle(`${folderName}.png`, { create: true });
      const wr = await fh.createWritable();
      await wr.write(blob); await wr.close();
      await new Promise(r => setTimeout(r, 30));
    }
  } else {
    const zip = new JSZip();
    const bannersFolder = zip.folder('Banners');
    for (let i = 0; i < SIZES.length; i++) {
      const size = SIZES[i];
      lbl.textContent  = `${size.name} (${i + 1}/${SIZES.length})`;
      fill.style.width = ((i / SIZES.length) * 100) + '%';
      const blob = await renderToBlob(size);
      const folderName = size.name.replace(/[/\\:*?<>|]/g, '-').trim();
      bannersFolder.folder(folderName).file(`${folderName}.png`, blob);
      await new Promise(r => setTimeout(r, 30));
    }
    fill.style.width = '90%'; lbl.textContent = 'Zipping...';
    const zipBlob = await zip.generateAsync({ type: 'blob' });
    const url = URL.createObjectURL(zipBlob);
    const a = document.createElement('a');
    a.href = url; a.download = 'Banners.zip'; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  fill.style.width = '100%'; lbl.textContent = 'Done!';
  btn.disabled = false;
  setTimeout(() => { wrap.classList.remove('visible'); fill.style.width = '0%'; }, 2000);
});

document.getElementById('logoPreset').addEventListener('change', e => {
  const preset = LOGO_PRESETS[e.target.value];
  if (!preset) { state.logoImage = null; renderAll(); return; }
  const img = new Image();
  img.onload = () => {
    state.logoImage = img;
    state.barColor  = preset.barColor;  state.textColor  = preset.textColor;
    barColorTxt.value = preset.barColor;  barColorPick.value = preset.barColor;
    txtColorTxt.value = preset.textColor; txtColorPick.value = preset.textColor;
    renderAll();
  };
  img.src = preset.src;
});

document.getElementById('logoPreset').addEventListener('change', function(e) {
  var preset = LOGO_PRESETS[e.target.value];
  if (!preset) { state.logoImage = null; renderAll(); return; }
  var img = new Image();
  img.onload = function() {
    state.logoImage = img;
    state.barColor  = preset.barColor;  state.textColor  = preset.textColor;
    barColorTxt.value = preset.barColor;  barColorPick.value = preset.barColor;
    txtColorTxt.value = preset.textColor; txtColorPick.value = preset.textColor;
    renderAll();
  };
  img.src = preset.src;
});

renderAll();
