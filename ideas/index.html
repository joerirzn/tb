<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ideas</title>
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="stylesheet" href="../shared/motion.css">
<link rel="stylesheet" href="../shared/shell.css">
<link rel="stylesheet" href="../shared/tool.css">
<script src="../shared/motion.js" defer></script>
<style>
  /* the shared tool design is in shared/tool.css; this is only what is the Ideas page's own */
  /* the ideas over the full width, like the tools, with sharing one above them */
  .board { width: 100%; }
  .board .app-header { margin-bottom: 18px; }
  .board .app-header .btn { width: auto; height: 38px; font-size: 13px; }
  .composer { background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--radius-lg); padding: 18px; margin-bottom: 14px; }
  .composer .section-label { margin-bottom: 4px; }
  .composer-actions { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .composer-actions .btn { width: auto; }
  .count { font-size: 11px; color: var(--faint); text-align: right; margin-top: 4px; }
  #ideaForm .btn { margin-top: 4px; }
  #formMsg:empty { display: none; }
  #listMsg:empty { display: none; }
  #listMsg { margin-bottom: 12px; }

  /* filters and sorting above the ideas */
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .filters { display: flex; gap: 2px; flex-wrap: wrap; padding: 3px; border-radius: var(--radius-pill); background: var(--surface); border: 1px solid var(--border-hover); }
  button.chip { height: 30px; border: none; background: none; color: var(--faint); font: 600 12px var(--font); padding: 0 12px; cursor: pointer; transition: color .15s ease, background-color .15s ease; }
  button.chip:hover { color: var(--muted); }
  button.chip .n { color: var(--faint); margin-left: 5px; font-weight: 500; }
  button.chip.on { background: var(--surface-3); color: var(--text); box-shadow: inset 0 0 0 1px var(--border-hover); }
  .sort { width: auto; height: 38px; padding: 0 34px 0 14px; font-size: 12.5px; font-weight: 600; border-radius: var(--radius-pill); background-color: var(--surface); }

  /* the ideas: one hairline sheet, like the settings */
  .idea-list { display: flex; flex-direction: column; gap: 1px; background: var(--hairline); border: 1px solid var(--hairline); border-radius: var(--radius-lg); overflow: hidden; }
  .idea { display: flex; gap: 16px; padding: 18px; background: var(--surface); scroll-margin-top: 24px; transition: background-color .4s ease; }
  .idea.flash { background: #1a1625; }
  .vote {
    flex: none; width: 52px; height: 60px; border-radius: 12px; cursor: pointer;
    background: var(--field); border: 1px solid var(--border-hover); color: var(--text);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    font: 700 15px var(--font); transition: transform .1s ease, border-color .15s ease, color .15s ease;
  }
  .vote svg { width: 16px; height: 16px; stroke: currentColor; fill: none; }
  .vote:hover { border-color: rgba(255, 255, 255, 0.3); }
  .vote:active { transform: scale(0.96); }
  .vote.on { border-color: var(--accent); color: #fff; background: rgba(139, 92, 246, 0.14); }
  .vote.on svg { color: var(--accent); }
  .idea-body { flex: 1; min-width: 0; }
  .idea-top { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
  .idea-title { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; margin: 0; flex: 1; min-width: 200px; overflow-wrap: anywhere; }
  .status { font-size: 10.5px; font-weight: 700; border-radius: 5px; padding: 2px 8px; color: var(--muted); background: var(--surface-3); white-space: nowrap; }
  .status.new { color: #fff; background: var(--accent); }
  .status.planned { color: #1a0a00; background: #f97316; }
  .status.in-progress { color: #1a1400; background: var(--warning); }
  .status.done { color: #002616; background: var(--success); }
  .status.declined { color: var(--faint); text-decoration: line-through; }
  .idea-text { max-width: 90ch; font-size: 13px; line-height: 1.55; color: var(--muted); margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .meta { font-size: 11.5px; color: var(--faint); margin-top: 8px; }
  .actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .actions select { width: auto; height: 28px; padding: 0 30px 0 11px; font-size: 11.5px; font-weight: 600; border-radius: var(--radius-pill); background-position: right 10px center; }

  .comments { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px; }
  .comment { font-size: 13px; line-height: 1.5; }
  .comment .who { font-size: 11.5px; color: var(--faint); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .comment p { margin: 2px 0 0; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
  .link-btn { background: none; border: none; padding: 0; color: var(--faint); font: 600 11.5px var(--font); cursor: pointer; }
  .link-btn:hover { color: var(--error); }
  .comment-form { display: flex; gap: 8px; align-items: flex-end; }
  .comment-form textarea { min-height: 40px; height: 40px; padding: 9px 12px; }
  .comment-form .btn-ghost { height: 40px; }
  .empty { text-align: center; color: var(--faint); font-size: 13px; padding: 48px 24px; background: var(--surface); }

  @media (max-width: 560px) {
    .idea { gap: 12px; padding: 14px; }
    .vote { width: 46px; height: 54px; }
    .comment-form { flex-direction: column; align-items: stretch; }
  }
</style>
</head>
<body>
<script src="../shared/shell.js"></script>

<div class="board">

<div class="app-header">
  <h1>Ideas <span>· suggest a tool or vote for what gets built next</span></h1>
  <button class="btn" type="button" id="shareBtn" aria-expanded="false" aria-controls="composer"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Suggest a tool</button>
</div>

<!-- sharing an idea opens above the list -->
<section class="composer" id="composer" hidden aria-label="Suggest a tool">
  <div class="section-label plain">Suggest a tool<span class="end"><button class="btn-ghost small" type="button" id="closeComposer">Cancel</button></span></div>
  <p class="note" style="margin:0 0 14px">Missing a tool, or a feature in one? What should it do, and what would it save you?</p>
  <form id="ideaForm" novalidate>
    <div class="field">
      <label for="title">Title</label>
      <input id="title" type="text" maxlength="120" placeholder="e.g. Story maker for releases" autocomplete="off">
    </div>
    <div class="field">
      <label for="body">Explain your suggestion <span class="opt">optional</span></label>
      <textarea id="body" maxlength="2000" placeholder="Who uses it, what goes in, what comes out?"></textarea>
      <p class="count" id="bodyCount">0 / 2000</p>
    </div>
    <div class="composer-actions">
      <button class="btn" type="submit">Send suggestion</button>
      <p class="msg" id="formMsg" role="alert"></p>
    </div>
  </form>
</section>
<p class="msg ok" id="sharedMsg" role="status" hidden style="margin-bottom:12px">Thanks! Your suggestion is on the board.</p>

<main>
    <div class="toolbar">
      <div class="filters" id="filters" role="tablist" aria-label="Filter by status"></div>
      <select class="sort" id="sort" aria-label="Sort">
        <option value="votes">Most votes</option>
        <option value="new">Newest</option>
      </select>
    </div>
    <p class="msg err" id="listMsg" role="alert"></p>
    <div class="idea-list" id="list"></div>
</main>

</div>

<script>
(function () {
  const STATUS = { 'new': 'New', 'planned': 'Planned', 'in-progress': 'In progress', 'done': 'Done', 'declined': 'Declined' };
  const $ = id => document.getElementById(id);
  let data = { ideas: [], isAdmin: false }, filter = 'all', sort = 'votes';
  const open = new Set();   // ideas with their comments shown
  // motion: only what is new moves; a vote or a re-sort does not make everything fly in again
  const seen = new Set();            // ideas already on screen
  const justOpened = new Set();      // comment boxes opened by a click
  const commentCache = {};           // idea id -> comments, so a re-render shows them at once
  const stale = new Set();           // ideas whose comments need fetching
  let animateAll = true;             // first render, filter or sort change
  let postedTo = 0;                  // idea that just got a comment from you

  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function ago(t) {
    const m = Math.round((Date.now() - t) / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return m + ' min ago';
    if (m < 60 * 24) return Math.round(m / 60) + ' h ago';
    if (m < 60 * 24 * 7) return Math.round(m / 1440) + ' d ago';
    return new Date(t).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }
  function who(name, job) { return (name || 'Former member') + (job ? ' · ' + job : ''); }

  async function api(path, body) {
    const r = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
    let j = {}; try { j = await r.json(); } catch (e) { }
    if (r.status === 401) { location.href = '/login?next=' + encodeURIComponent(location.pathname); throw new Error('signed out'); }
    if (!r.ok) throw new Error(j.error || 'Something went wrong. Try again.');
    return j;
  }

  // #new (Suggest a tool in the sidebar): straight to the form
  // #idea-12 (from a notification): show that idea with its comments open
  function focusFromHash() {
    if (location.hash === '#new') { openComposer(); return; }
    const m = location.hash.match(/^#idea-(\d+)$/); if (!m) return;
    const id = Number(m[1]); if (!data.ideas.some(i => i.id === id)) return;
    filter = 'all'; open.add(id); render();
    const card = document.getElementById('idea-' + id);
    if (card) { card.scrollIntoView({ behavior: 'smooth', block: 'start' }); card.classList.add('flash'); setTimeout(() => card.classList.remove('flash'), 2500); }
  }
  window.addEventListener('hashchange', () => load());

  async function load() {
    try { data = await api('/api/ideas'); $('listMsg').textContent = ''; render(); focusFromHash(); }
    catch (e) {
      if (location.protocol !== 'file:') { $('listMsg').textContent = e.message; return; }
      // opened as a file: sample ideas to see the design
      const now = Date.now(), h = 36e5;
      data = { isAdmin: true, ideas: [
        { id: 1, title: 'Story maker for releases', body: 'Instagram stories for a new release: artwork, artist and "Out now" in our templates.', status: 'planned', votes: 9, voted: true, comments: 3, author: 'Sam de Vries', author_job: 'Social', created_at: now - 50 * h, mine: false },
        { id: 2, title: 'Batch export for the Cover Converter', body: 'Drop a whole folder and get one zip back.', status: 'new', votes: 4, voted: false, comments: 0, author: 'Joeri Roozen', author_job: 'Designer', created_at: now - 5 * h, mine: true },
        { id: 3, title: 'Lyric video template', body: '', status: 'in-progress', votes: 3, voted: false, comments: 1, author: 'Lisa Bakker', author_job: 'Video', created_at: now - 200 * h, mine: false },
        { id: 4, title: 'Spotify Canvas cropper', body: 'Crop a video to 9:16 and 8 seconds.', status: 'done', votes: 2, voted: false, comments: 0, author: 'Tom', author_job: '', created_at: now - 600 * h, mine: false },
      ] };
      render(); focusFromHash();
    }
  }

  function renderFilters() {
    const box = $('filters'); box.innerHTML = '';
    const counts = { all: data.ideas.length };
    data.ideas.forEach(i => counts[i.status] = (counts[i.status] || 0) + 1);
    [['all', 'All']].concat(Object.entries(STATUS)).forEach(([k, label]) => {
      if (k !== 'all' && !counts[k] && filter !== k) return;
      const b = el('button', 'chip' + (filter === k ? ' on' : ''), label);
      b.type = 'button'; b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', filter === k);
      b.appendChild(el('span', 'n', String(counts[k] || 0)));
      b.addEventListener('click', () => { if (filter !== k) { filter = k; animateAll = true; render(); } });
      box.appendChild(b);
    });
  }

  function render() {
    renderFilters();
    const list = $('list'); list.innerHTML = '';
    let ideas = data.ideas.filter(i => filter === 'all' || i.status === filter);
    ideas.sort(sort === 'new' ? (a, b) => b.created_at - a.created_at : (a, b) => b.votes - a.votes || b.created_at - a.created_at);
    if (!ideas.length) {
      list.appendChild(el('div', 'empty', data.ideas.length ? 'No ideas with this status.' : 'No ideas yet. Be the first to share one.'));
      return;
    }
    ideas.forEach((i, k) => {
      const card = ideaCard(i);
      list.appendChild(card);
      if (window.tbIn && (animateAll || !seen.has(i.id))) tbIn(card, animateAll ? Math.min(k, 8) * 40 : 0);
      seen.add(i.id);
    });
    animateAll = false;
  }

  function ideaCard(i) {
    const card = el('article', 'idea'); card.id = 'idea-' + i.id;
    const vote = el('button', 'vote' + (i.voted ? ' on' : ''));
    vote.type = 'button';
    vote.setAttribute('aria-pressed', i.voted);
    vote.setAttribute('aria-label', (i.voted ? 'Remove your vote' : 'Vote') + ' (' + i.votes + ' votes)');
    vote.innerHTML = '<svg viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>';
    vote.appendChild(el('span', null, String(i.votes)));
    vote.addEventListener('click', async () => {
      try {
        const r = await api('/api/ideas/' + i.id + '/vote', {}); i.voted = r.voted; i.votes = r.votes; render();
        if (r.voted && window.tbBump) tbBump(document.querySelector('#idea-' + i.id + ' .vote'));   // a small hop for your vote
      }
      catch (e) { $('listMsg').textContent = e.message; }
    });

    const body = el('div', 'idea-body');
    const top = el('div', 'idea-top');
    top.appendChild(el('h2', 'idea-title', i.title));
    top.appendChild(el('span', 'status ' + i.status, STATUS[i.status] || i.status));
    body.appendChild(top);
    if (i.body) body.appendChild(el('p', 'idea-text', i.body));
    body.appendChild(el('div', 'meta', who(i.author, i.author_job) + ' · ' + ago(i.created_at)));

    const actions = el('div', 'actions');
    const toggle = el('button', 'btn-ghost small', i.comments === 1 ? '1 comment' : i.comments + ' comments');
    toggle.type = 'button';
    toggle.setAttribute('aria-expanded', open.has(i.id));
    toggle.addEventListener('click', () => {
      if (open.has(i.id)) open.delete(i.id); else { open.add(i.id); justOpened.add(i.id); stale.add(i.id); }
      render();
    });
    actions.appendChild(toggle);
    if (data.isAdmin) {
      const sel = el('select'); sel.setAttribute('aria-label', 'Status');
      Object.entries(STATUS).forEach(([k, label]) => { const o = el('option', null, label); o.value = k; o.selected = k === i.status; sel.appendChild(o); });
      sel.addEventListener('change', async () => {
        try { await api('/api/ideas/' + i.id + '/status', { status: sel.value }); i.status = sel.value; render(); }
        catch (e) { $('listMsg').textContent = e.message; }
      });
      actions.appendChild(sel);
    }
    if (i.mine || data.isAdmin) {
      const del = el('button', 'btn-ghost small danger', 'Delete');
      del.type = 'button';
      del.addEventListener('click', async () => {
        if (!confirm('Delete the idea "' + i.title + '" with its votes and comments?')) return;
        try { await api('/api/ideas/' + i.id + '/delete', {}); load(); }
        catch (e) { $('listMsg').textContent = e.message; }
      });
      actions.appendChild(del);
    }
    body.appendChild(actions);
    if (open.has(i.id)) body.appendChild(commentsBox(i));

    card.appendChild(vote); card.appendChild(body);
    return card;
  }

  function commentsBox(i) {
    const box = el('div', 'comments');
    const list = el('div', null); list.style.cssText = 'display:flex;flex-direction:column;gap:12px';
    box.appendChild(list);
    if (justOpened.delete(i.id) && window.tbIn) tbIn(box);

    const form = el('form', 'comment-form'); form.noValidate = true;
    const ta = el('textarea'); ta.maxLength = 1000; ta.placeholder = 'Write a comment'; ta.setAttribute('aria-label', 'Comment');
    const send = el('button', 'btn-ghost', 'Post'); send.type = 'submit';
    form.appendChild(ta); form.appendChild(send);
    const msg = el('p', 'msg err');
    box.appendChild(form); box.appendChild(msg);

    function showComments(comments, animateLast) {
        list.innerHTML = '';
        if (!comments.length) list.appendChild(el('p', 'note', 'No comments yet.'));
        comments.forEach((c, k) => {
          const row = el('div', 'comment'), head = el('div', 'who');
          head.appendChild(el('span', null, who(c.author, c.author_job) + ' · ' + ago(c.created_at)));
          if (c.mine || data.isAdmin) {
            const d = el('button', 'link-btn', 'Delete'); d.type = 'button';
            d.addEventListener('click', async () => {
              if (!confirm('Delete this comment?')) return;
              try { await api('/api/comments/' + c.id + '/delete', {}); i.comments = Math.max(0, i.comments - 1); render(); }
              catch (e) { msg.textContent = e.message; }
            });
            head.appendChild(d);
          }
          row.appendChild(head); row.appendChild(el('p', null, c.body));
          list.appendChild(row);
          if (animateLast && k === comments.length - 1 && window.tbIn) tbIn(row);
        });
    }
    async function loadComments(animateLast) {
      try {
        const r = await api('/api/ideas/' + i.id + '/comments');
        commentCache[i.id] = r.comments; stale.delete(i.id);
        if (box.isConnected) showComments(r.comments, animateLast);
      } catch (e) { msg.textContent = e.message; }
    }
    form.addEventListener('submit', async e => {
      e.preventDefault(); msg.textContent = '';
      const text = ta.value.trim(); if (!text) { msg.textContent = 'Write a comment first.'; return; }
      send.disabled = true;
      try { await api('/api/ideas/' + i.id + '/comments', { body: text }); i.comments++; stale.add(i.id); postedTo = i.id; render(); }
      catch (err) { msg.textContent = err.message; send.disabled = false; }
    });
    // cached comments show at once; fetch only when opened or after posting
    if (commentCache[i.id]) showComments(commentCache[i.id]);
    else list.appendChild(el('p', 'note', 'Loading comments…'));
    if (stale.has(i.id) || !commentCache[i.id]) { const anim = postedTo === i.id; postedTo = 0; loadComments(anim); }
    return box;
  }

  // share an idea: the box opens above the list
  function openComposer() {
    $('composer').hidden = false; $('shareBtn').setAttribute('aria-expanded', 'true'); $('sharedMsg').hidden = true;
    if (window.tbIn) tbIn($('composer'));
    $('title').focus();
  }
  function closeComposer() {
    $('composer').hidden = true; $('shareBtn').setAttribute('aria-expanded', 'false');
    if (location.hash === '#new') history.replaceState(null, '', location.pathname);
  }
  $('shareBtn').addEventListener('click', () => $('composer').hidden ? openComposer() : $('title').focus());
  $('closeComposer').addEventListener('click', closeComposer);
  $('composer').addEventListener('keydown', e => { if (e.key === 'Escape') closeComposer(); });

  $('body').addEventListener('input', () => { $('bodyCount').textContent = $('body').value.length + ' / 2000'; });
  $('ideaForm').addEventListener('submit', async e => {
    e.preventDefault();
    const msg = $('formMsg'), btn = e.target.querySelector('.btn');
    msg.className = 'msg'; msg.textContent = '';
    const title = $('title').value.trim();
    if (!title) { msg.className = 'msg err'; msg.textContent = 'Give your idea a title.'; $('title').focus(); return; }
    btn.disabled = true;
    try {
      await api('/api/ideas', { title, body: $('body').value.trim() });
      e.target.reset(); $('bodyCount').textContent = '0 / 2000';
      closeComposer(); $('sharedMsg').hidden = false;
      filter = 'all'; sort = 'new'; $('sort').value = 'new';
      await load();
    } catch (err) { msg.className = 'msg err'; msg.textContent = err.message; }
    btn.disabled = false;
  });
  $('sort').addEventListener('change', () => { sort = $('sort').value; animateAll = true; render(); });

  load();
})();
</script>
</body>
</html>
